<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · 404 Studio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f4f5fb; --card: #ffffff; --ink: #1e1b4b; --muted: #64748b; --line: #e2e8f0;
      --brand: #6366f1; --grad: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      --new: #4f46e5; --new-bg: #eef2ff;
      --contacted: #b45309; --contacted-bg: #fef3c7;
      --won: #047857; --won-bg: #d1fae5;
      --lost: #475569; --lost-bg: #e2e8f0;
      --danger: #be123c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
    button, input, select, textarea { font: inherit; color: inherit; }
    [hidden] { display: none !important; }
    :focus-visible { outline: 3px solid rgba(99,102,241,.45); outline-offset: 2px; }

    .center { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .panel { background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 40px 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 20px 50px rgba(79,70,229,.08); }
    .logo { width: 56px; height: 56px; border-radius: 16px; background: var(--grad); color: #fff; font-weight: 800; display: grid; place-items: center; margin: 0 auto 18px; letter-spacing: -.02em; }
    .panel h1 { font-size: 1.5rem; margin: 0 0 8px; }
    .panel p { color: var(--muted); margin: 0 0 24px; }
    .btn { border: 0; cursor: pointer; border-radius: 999px; padding: 11px 22px; font-weight: 700; transition: transform .15s, box-shadow .15s, background .15s; }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 20px rgba(99,102,241,.3); }
    .btn-primary:hover { box-shadow: 0 10px 26px rgba(99,102,241,.42); }
    .btn-ghost { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-danger { background: #fff; border: 1px solid #fecdd3; color: var(--danger); }
    .btn-danger:hover { background: #fff1f2; }
    .btn[disabled] { opacity: .6; cursor: default; }
    .err { color: var(--danger); font-size: .9rem; margin-top: 14px; }

    /* App shell */
    .app { height: 100%; display: flex; flex-direction: column; }
    .topbar { display: flex; align-items: center; gap: 14px; padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--line); }
    .topbar .logo { width: 36px; height: 36px; border-radius: 10px; margin: 0; font-size: .8rem; }
    .topbar h1 { font-size: 1.05rem; margin: 0; }
    .topbar .sp { flex: 1; }
    .who { color: var(--muted); font-size: .85rem; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px 20px 0; }
    .stat { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 16px; text-align: left; cursor: pointer; }
    .stat b { display: block; font-size: 1.6rem; line-height: 1.1; }
    .stat span { font-size: .8rem; color: var(--muted); font-weight: 600; }
    .stat[aria-pressed="true"] { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    .main { flex: 1; min-height: 0; display: grid; grid-template-columns: 380px 1fr; gap: 16px; padding: 16px 20px 20px; }
    .col { background: #fff; border: 1px solid var(--line); border-radius: 20px; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .tools { padding: 12px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; }
    .tools input { flex: 1; min-width: 0; padding: 9px 14px; border: 1px solid var(--line); border-radius: 999px; background: #f8fafc; }
    .list { overflow-y: auto; flex: 1; }
    .row { display: block; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: #fff; padding: 14px 16px; cursor: pointer; }
    .row:hover { background: #f8fafc; }
    .row[aria-current="true"] { background: var(--new-bg); box-shadow: inset 3px 0 0 var(--brand); }
    .row .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
    .row .nm { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row .when { color: var(--muted); font-size: .75rem; flex-shrink: 0; }
    .row .svc { font-size: .8rem; color: var(--brand); font-weight: 600; margin-top: 1px; }
    .row .snip { font-size: .85rem; color: var(--muted); margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .pill { display: inline-block; font-size: .72rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; text-transform: capitalize; }
    .pill.new { background: var(--new-bg); color: var(--new); }
    .pill.contacted { background: var(--contacted-bg); color: var(--contacted); }
    .pill.won { background: var(--won-bg); color: var(--won); }
    .pill.lost { background: var(--lost-bg); color: var(--lost); }
    .empty { padding: 48px 24px; text-align: center; color: var(--muted); }

    .detail { overflow-y: auto; padding: 24px 28px; }
    .back { display: none; margin-bottom: 14px; }
    .d-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    .d-head h2 { margin: 0; font-size: 1.5rem; }
    .d-sub { color: var(--muted); font-size: .9rem; margin: 4px 0 18px; }
    .d-sub a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .d-sub a:hover { text-decoration: underline; }
    .label { display: block; font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 20px 0 6px; }
    .concern { background: #f8fafc; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .field { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    textarea.field { min-height: 120px; resize: vertical; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; }
    .saved { font-size: .85rem; color: var(--won); font-weight: 600; }
    .banner { margin: 12px 20px 0; padding: 10px 16px; border-radius: 12px; background: #fff1f2; color: var(--danger); font-size: .9rem; }

    @media (max-width: 860px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .main { grid-template-columns: 1fr; }
      .app:not(.has-sel) .detail-col { display: none; }
      .app.has-sel .list-col { display: none; }
      .back { display: inline-block; }
      .detail { padding: 18px; }
      .who { display: none; }
    }
  </style>
</head>
<body>

  <!-- Loading -->
  <div id="v-loading" class="center"><p style="color:var(--muted)">Loading…</p></div>

  <!-- Sign in -->
  <div id="v-signin" class="center" hidden>
    <div class="panel">
      <div class="logo">404</div>
      <h1>Admin sign in</h1>
      <p>Sign in with the Google account you use to run 404 Studio.</p>
      <button id="btn-signin" class="btn btn-primary" type="button">Sign in with Google</button>
      <div id="signin-err" class="err" role="alert" hidden></div>
    </div>
  </div>

  <!-- Signed in, but not an admin -->
  <div id="v-denied" class="center" hidden>
    <div class="panel">
      <div class="logo">404</div>
      <h1>No admin access</h1>
      <p>The account <strong id="denied-who"></strong> isn't set up as an admin. Sign out and try the account you use for 404 Studio.</p>
      <button id="btn-denied-out" class="btn btn-ghost" type="button">Sign out</button>
    </div>
  </div>

  <!-- CRM -->
  <div id="v-app" class="app" hidden>
    <header class="topbar">
      <div class="logo">404</div>
      <h1>Leads</h1>
      <div class="sp"></div>
      <span class="who" id="who"></span>
      <button id="btn-refresh" class="btn btn-ghost" type="button">Refresh</button>
      <button id="btn-out" class="btn btn-ghost" type="button">Sign out</button>
    </header>
    <div id="banner" class="banner" role="alert" hidden></div>
    <div class="stats" id="stats"></div>
    <div class="main">
      <section class="col list-col" aria-label="Leads">
        <div class="tools"><input id="q" type="search" placeholder="Search name, email, service…" aria-label="Search leads"></div>
        <div class="list" id="list"></div>
      </section>
      <section class="col detail-col" aria-label="Lead details">
        <div class="detail" id="detail"></div>
      </section>
    </div>
  </div>

<script>
(() => {
  const SB_URL = 'https://acxrobzulaswsubfoghg.supabase.co';
  const SB_KEY = 'sb_publishable_3Ehkqe8QtPVJQoh4FCZIVg_m2f8SOTD';
  const STATUSES = ['new', 'contacted', 'won', 'lost'];
  const $ = id => document.getElementById(id);

  let sb = null, leads = [], filter = 'all', query = '', selectedId = null;

  // Small helper to build elements safely (lead data is always set as text, never as HTML)
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v === false || v == null) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    kids.flat().forEach(c => c != null && el.append(c));
    return el;
  };

  const show = id => ['v-loading', 'v-signin', 'v-denied', 'v-app'].forEach(v => { $(v).hidden = v !== id; });
  const fmtDate = d => new Date(d).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const ago = d => {
    const s = (Date.now() - new Date(d)) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(d).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };
  const banner = msg => { $('banner').textContent = msg || ''; $('banner').hidden = !msg; };

  const loadLib = () => new Promise((resolve, reject) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js';
    sc.onload = resolve;
    sc.onerror = () => reject(new Error('Could not load the sign-in library. Check your connection.'));
    document.head.append(sc);
  });

  async function init() {
    try {
      await loadLib();
      sb = window.supabase.createClient(SB_URL, SB_KEY);
      sb.auth.onAuthStateChange(evt => { if (evt === 'SIGNED_OUT') show('v-signin'); });
      const { data: { session } } = await sb.auth.getSession();
      if (!session) return show('v-signin');
      await enter(session);
    } catch (e) {
      show('v-signin');
      $('signin-err').textContent = e.message || 'Something went wrong.';
      $('signin-err').hidden = false;
    }
  }

  async function enter(session) {
    const email = session.user.email || 'this account';
    $('who').textContent = email;
    $('denied-who').textContent = email;
    const { data, error } = await sb.rpc('is_admin');
    if (error || data !== true) return show('v-denied');
    show('v-app');
    await loadLeads();
  }

  async function loadLeads() {
    banner('');
    const { data, error } = await sb.from('leads').select('*').order('created_at', { ascending: false });
    if (error) { banner('Could not load leads: ' + error.message); return; }
    leads = data || [];
    if (selectedId && !leads.some(l => l.id === selectedId)) selectedId = null;
    render();
  }

  const matches = l => {
    if (filter !== 'all' && l.status !== filter) return false;
    if (!query) return true;
    return [l.name, l.email, l.service, l.concern].some(v => (v || '').toLowerCase().includes(query));
  };

  function render() {
    renderStats(); renderList(); renderDetail();
    $('v-app').classList.toggle('has-sel', !!selectedId);
  }

  function renderStats() {
    const counts = Object.fromEntries(STATUSES.map(s => [s, leads.filter(l => l.status === s).length]));
    // 4 cards: New, Contacted, Won, Lost. Click one to filter; click again to show all.
    $('stats').replaceChildren(...STATUSES.map(s =>
      h('button', {
        class: 'stat', type: 'button', 'aria-pressed': filter === s ? 'true' : 'false',
        onclick: () => { filter = filter === s ? 'all' : s; render(); }
      }, h('b', { text: String(counts[s]) }), h('span', { text: s[0].toUpperCase() + s.slice(1) }))
    ));
  }

  function renderList() {
    const rows = leads.filter(matches);
    if (!rows.length) {
      $('list').replaceChildren(h('div', { class: 'empty', text: leads.length ? 'No leads match your search or filter.' : 'No leads yet. New messages from your website will show up here.' }));
      return;
    }
    $('list').replaceChildren(...rows.map(l =>
      h('button', {
        class: 'row', type: 'button', 'aria-current': l.id === selectedId ? 'true' : 'false',
        onclick: () => { selectedId = l.id; render(); }
      },
        h('div', { class: 'top' }, h('span', { class: 'nm', text: l.name }), h('span', { class: 'when', text: ago(l.created_at) })),
        h('div', { class: 'svc', text: l.service }),
        h('div', { class: 'snip', text: l.concern }),
        h('div', { style: 'margin-top:8px' }, h('span', { class: 'pill ' + l.status, text: l.status }))
      )
    ));
  }

  function renderDetail() {
    const l = leads.find(x => x.id === selectedId);
    if (!l) { $('detail').replaceChildren(h('div', { class: 'empty', text: 'Select a lead to see the full message.' })); return; }

    const first = (l.name || '').trim().split(/\s+/)[0] || 'there';
    const subject = 'Re: ' + l.service + ' | 404 Studio';
    const body = 'Hi ' + first + ',\n\nThanks for reaching out to 404 Studio about ' + l.service + '.\n\n\n\nBest,\n404 Studio';
    const gmail = 'https://mail.google.com/mail/?view=cm&fs=1&to=' + encodeURIComponent(l.email) + '&su=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);
    const mailto = 'mailto:' + encodeURIComponent(l.email) + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(body);

    const statusSel = h('select', { class: 'field', id: 'd-status', 'aria-label': 'Lead status' },
      STATUSES.map(s => h('option', { value: s, text: s[0].toUpperCase() + s.slice(1), selected: s === l.status })));
    const notes = h('textarea', { class: 'field', id: 'd-notes', placeholder: 'Quote, what you agreed on, next step…' });
    notes.value = l.notes || '';
    const saved = h('span', { class: 'saved', role: 'status' });
    const flash = msg => { saved.textContent = msg; setTimeout(() => { if (saved.textContent === msg) saved.textContent = ''; }, 2500); };

    const save = async patch => {
      const { data, error } = await sb.from('leads').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', l.id).select().single();
      if (error) { banner('Could not save: ' + error.message); return false; }
      banner('');
      Object.assign(l, data);
      return true;
    };

    statusSel.addEventListener('change', async () => {
      if (await save({ status: statusSel.value })) { renderStats(); renderList(); flash('Status updated'); renderDetailHeaderPill(); }
    });
    const saveBtn = h('button', { class: 'btn btn-primary', type: 'button', text: 'Save notes', onclick: async () => {
      saveBtn.disabled = true;
      if (await save({ notes: notes.value })) flash('Notes saved');
      saveBtn.disabled = false;
    } });

    const pill = h('span', { class: 'pill ' + l.status, text: l.status });
    function renderDetailHeaderPill() { pill.className = 'pill ' + l.status; pill.textContent = l.status; }

    const copyBtn = h('button', { class: 'btn btn-ghost', type: 'button', text: 'Copy email', onclick: async () => {
      try { await navigator.clipboard.writeText(l.email); flash('Email copied'); } catch (_) { flash('Copy failed'); }
    } });
    const delBtn = h('button', { class: 'btn btn-danger', type: 'button', text: 'Delete lead', onclick: async () => {
      if (!confirm('Delete the lead from ' + l.name + '? This cannot be undone.')) return;
      const { error } = await sb.from('leads').delete().eq('id', l.id);
      if (error) { banner('Could not delete: ' + error.message); return; }
      leads = leads.filter(x => x.id !== l.id); selectedId = null; render();
    } });

    $('detail').replaceChildren(
      h('button', { class: 'btn btn-ghost back', type: 'button', text: '← All leads', onclick: () => { selectedId = null; render(); } }),
      h('div', { class: 'd-head' }, h('h2', { text: l.name }), pill),
      h('div', { class: 'd-sub' }, h('a', { href: mailto, text: l.email }), ' · ' + l.service + ' · received ' + fmtDate(l.created_at)),
      h('span', { class: 'label', text: 'Their message' }),
      h('div', { class: 'concern', text: l.concern }),
      h('div', { class: 'actions' },
        h('a', { class: 'btn btn-primary', href: gmail, target: '_blank', rel: 'noopener', text: 'Reply in Gmail', style: 'text-decoration:none;display:inline-block' }),
        copyBtn
      ),
      h('label', { class: 'label', for: 'd-status', text: 'Status' }), statusSel,
      h('label', { class: 'label', for: 'd-notes', text: 'Your notes (only you can see these)' }), notes,
      h('div', { class: 'actions' }, saveBtn, saved),
      h('div', { class: 'actions', style: 'margin-top:28px;padding-top:18px;border-top:1px solid var(--line)' }, delBtn)
    );
  }

  // Wiring
  $('btn-signin').addEventListener('click', async e => {
    e.target.disabled = true; e.target.textContent = 'Opening Google…';
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: new URL('admin.html', location.href).href } });
    if (error) {
      e.target.disabled = false; e.target.textContent = 'Sign in with Google';
      $('signin-err').textContent = error.message; $('signin-err').hidden = false;
    }
  });
  const out = async () => { await sb.auth.signOut(); leads = []; selectedId = null; show('v-signin'); };
  $('btn-out').addEventListener('click', out);
  $('btn-denied-out').addEventListener('click', out);
  $('btn-refresh').addEventListener('click', loadLeads);
  $('q').addEventListener('input', e => { query = e.target.value.trim().toLowerCase(); renderList(); });
  window.addEventListener('focus', () => { if (!$('v-app').hidden) loadLeads(); });

  init();
})();
</script>
</body>
</html>
